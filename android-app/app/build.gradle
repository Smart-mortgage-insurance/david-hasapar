plugins {
    id 'com.android.application'
}

android {
    namespace 'com.davidhasapar.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.davidhasapar.manager"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // debug build is signed with the auto-generated debug key -> installable by sideload
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
